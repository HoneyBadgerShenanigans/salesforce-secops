# GitHub Actions Workflow Template for Salesforce SecOps CI & Security Audit
# To enable: copy this file to .github/workflows/security-audit.yml
name: CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pip-audit

      - name: Run Vulnerability Audit
        run: |
          pip-audit -r requirements.lock

      - name: Run Unit & Security Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
